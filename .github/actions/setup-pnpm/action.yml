name: Setup Node.js and pnpm
description: Install the Node.js and pnpm versions used by this repository

inputs:
  node-version:
    description: Node.js version
    required: false
    default: "24"
  registry-url:
    description: Optional npm registry URL. Set only for the publish job.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      with:
        version: 10.34.5

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
